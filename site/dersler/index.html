<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ders Dosyaları</title>
  <script>
    const archive = new URL('../', location.href);
    archive.search = location.search;
    archive.hash = /^#dersler(?:\/|$)/.test(location.hash) ? location.hash : '#dersler';
    location.replace(archive.href);
  </script>
</head>
<body><a href="../#dersler">Ders Dosyaları</a></body>
</html>
