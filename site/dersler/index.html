<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dersler · Paylaşım</title>
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/brand.css?v=menu-3">
  <link rel="stylesheet" href="../assets/course-cards.css">
  <style>
    :root {
      color-scheme: light;
      --ground: #f7f4ed;
      --paper: #fffdf8;
      --ink: #222c3a;
      --muted: #576476;
      --line: #e1d9cd;
      --navy: #223957;
      --blue-soft: #e8eef5;
      --gold: #9d7250;
      --gold-soft: #f4e9db;
      --green: #35624f;
      --green-soft: #e7f0e9;
      --radius: 17px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.55 system-ui, 'Segoe UI', sans-serif; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button, .button { cursor: pointer; }
    a:focus-visible, button:focus-visible { outline: 3px solid #86613d; outline-offset: 4px; }
    h1, h2, h3, p { margin: 0; }
    svg.icon { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .shell { max-width: 1120px; padding-inline: 30px; margin-inline: auto; }
    .site-header-inner { max-width: 1120px; margin-inline: auto; }
    main { min-height: calc(100vh - 135px); padding-top: 23px; padding-bottom: 36px; }
    main:focus { outline: none; }
    .archive-nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 18px; margin-bottom: 16px; }
    .archive-trail { min-width: 0; }
    .archive-trail ol { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 4px; margin: 0; padding: 0; list-style: none; }
    .archive-trail li { display: flex; align-items: center; gap: 4px; min-width: 0; color: var(--muted); font-size: 12px; }
    .archive-trail .icon { width: 13px; height: 13px; }
    .archive-trail a, .archive-trail [aria-current] { padding: 6px 7px; border-radius: 6px; overflow-wrap: anywhere; }
    .archive-trail a { color: var(--navy); font-weight: 600; }
    .archive-trail a:hover { background: var(--blue-soft); text-decoration: underline; text-underline-offset: 3px; }
    .archive-trail [aria-current] { color: var(--navy); background: var(--gold-soft); font-weight: 700; }
    .page-head h1 { font: 500 clamp(33px, 5vw, 51px)/1.08 Georgia, serif; letter-spacing: -.045em; margin: 6px 0 9px; }
    .eyebrow { color: #6d553d; font-size: 11px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; }
    .section-line { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin: 25px 0 13px; }
    .section-line h1 { color: var(--navy); font: 400 33px/1.08 Georgia, serif; letter-spacing: -.035em; }
    .section-line h2 { font-size: 20px; letter-spacing: -.35px; }
    .meta { color: var(--muted); font-size: 13px; }
    .grid { display: grid; gap: 13px; }
    .folder-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .card { display: grid; align-content: space-between; gap: 12px; position: relative; min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 17px 19px; box-shadow: 0 4px 11px #342c1910; transition: border-color .15s, background .15s; }
    .card:hover { border-color: #a4b2c1; background: #fff; }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card-icon { display: grid; place-items: center; color: #355474; background: var(--blue-soft); width: 39px; height: 39px; border-radius: 11px; flex: none; }
    .tone-sand { color: #815737; background: var(--gold-soft); }
    .tone-green { color: var(--green); background: var(--green-soft); }
    .card h3 { font-size: 16px; line-height: 1.28; letter-spacing: -.22px; }
    .arrow { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 50%; background: var(--blue-soft); color: var(--navy); flex: none; }
    .arrow svg { width: 15px; height: 15px; }
    .page-head { margin: 12px 0 25px; }
    .page-head h1 { color: var(--navy); }
    .folder-card { padding: 23px; min-height: 180px; }
    .folder-card h3 { font-size: 21px; }
    .folder-card .meta { font-size: 13px; }
    .switcher { display: inline-flex; flex-wrap: wrap; gap: 4px; margin: 0 0 18px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
    .switcher a { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 11px; min-height: 44px; border-radius: 7px; color: var(--navy); font-size: 13px; font-weight: 650; }
    .switcher a svg { width: 16px; height: 16px; }
    .switcher a:hover { background: var(--blue-soft); }
    .switcher a[aria-current] { color: #fff8ed; background: var(--navy); }
    .button { border: 0; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: var(--navy); color: #fff; padding: 9px 14px; min-height: 41px; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .button:hover { background: #354e6d; }
    .button:disabled { opacity: .58; cursor: wait; }
    .practice-link { margin-top: 12px; }
    .button svg { width: 17px; height: 17px; }
    .files { border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); }
    .file { display: flex; gap: 12px; align-items: center; padding: 13px 16px; }
    .file + .file { border-top: 1px solid var(--line); }
    .file-icon { background: #f7e8e2; color: #88463b; border-radius: 8px; min-width: 36px; padding: 7px 5px; font-size: 10px; font-weight: 800; text-align: center; }
    .file-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .file-name strong { display: block; font-weight: 660; }
    .file-actions { display: flex; gap: 7px; flex: none; }
    .file-actions a { display: inline-flex; align-items: center; border: 1px solid var(--line); color: var(--navy); padding: 6px 10px; border-radius: 7px; font-weight: 650; min-height: 36px; font-size: 12px; }
    .file-actions a:hover { background: var(--blue-soft); }
    .empty { padding: 22px 19px; color: var(--muted); }
    footer { color: var(--muted); font-size: 12px; padding: 16px 0 22px; border-top: 1px solid var(--line); }
    @media (max-width: 800px) {
      .shell { padding-inline: 20px; }
    }
    @media (max-width: 700px) {
      .file { display: grid; grid-template-columns: 36px minmax(0, 1fr); align-items: start; gap: 8px 12px; }
      .file-icon { grid-column: 1; }
      .file-name { grid-column: 2; min-width: 0; }
      .file-actions { grid-column: 1 / -1; flex-wrap: wrap; min-width: 0; }
    }
    @media (max-width: 480px) {
      .shell { padding-inline: 16px; }
      .archive-nav { flex-direction: column; align-items: flex-start; }
      .switcher { display: flex; }
      .switcher a { flex: 1 1 120px; text-align: center; }
      .card { padding: 13px; gap: 9px; }
      .card h3 { font-size: 14px; }
      .folder-grid { grid-template-columns: 1fr; }
      .folder-card { min-height: 132px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-mark" href="../#home" aria-label="Ana sayfa"><span lang="ar" dir="rtl">بِسْمِ اللَّهِ</span></a>
      <nav class="site-nav" aria-label="Ana menü">
        <a href="#dersler" aria-current="page">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5.5C8.3 4.2 5.7 3.7 3 4.5v10.8c2.7-.8 5.3-.3 7 1 1.7-1.3 4.3-1.8 7-1V4.5c-2.7-.8-5.3-.3-7 1Zm0 0v10.8"/></svg>
          <span>Ders Dosyaları</span>
        </a>
        <a href="../#sorular">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4.5" y="4.5" width="11" height="13" rx="1.5"/><path d="M8 4.5V3h4v1.5M7.5 11l1.8 1.8 3.4-3.6"/></svg>
          <span>Çalışma Soruları</span>
        </a>
      </nav>
    </div>
  </header>
  <main class="shell" id="main" tabindex="-1"></main>
  <footer class="shell" id="storage-note" role="status">Ders arşivi</footer>
  <script type="module">
    import { courses, extraCourseIds, folders } from './catalog.mjs';

    const extrasUrl = '#dersler/ek-dersler';
    const icons = {
      book: '<path d="M12 6c-2-1.6-5-2-9-1v13c3.5-1 6.6-.6 9 1 2.4-1.6 5.5-2 9-1V5c-4-1-7-.6-9 1v13"/>',
      folder: '<path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      arrow: '<path d="M4 12h15m-6-6 6 6-6 6"/>',
      back: '<path d="M20 12H5m6-6-6 6 6 6"/>',
      chevron: '<path d="m9 6 6 6-6 6"/>'
    };
    const main = document.getElementById('main');
    const courseById = new Map(courses);
    const esc = value => String(value).replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[character]));
    const icon = key => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[key]}</svg>`;
    const courseUrl = (id, folder = '') =>
      (extraCourseIds.has(id) ? extrasUrl : '#dersler') + '/' + id + (folder ? '/' + folder : '');
    const currentPage = () => location.hash || '#dersler';
    const numberFormat = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 1 });
    const fileNameOrder = new Intl.Collator('tr-TR', { numeric: true });

    let files = [];
    let fileListState = 'loading';

    function forFolder(course, folder) {
      return files.filter(file => file.course === course && file.folder === folder)
        .sort((left, right) => fileNameOrder.compare(left.name, right.name));
    }

    function archiveNav({ course, folder, extras = false } = {}) {
      const trail = [['#dersler', 'Ders Dosyaları']];
      const extraCourse = extraCourseIds.has(course);
      if (extras || extraCourse) trail.push([extrasUrl, 'Ek Dersler']);
      if (course) trail.push([courseUrl(course), courseById.get(course)]);
      if (folder) trail.push([courseUrl(course, folder), folders[folder].title]);

      const parent = trail.at(-2)?.[0] ?? '../#home';
      const backLabel = folder ? 'Ders sayfasına dön'
        : extraCourse ? 'Ek derslere dön'
        : course || extras ? 'Ders listesine dön'
        : 'Ana sayfaya dön';
      const steps = trail.length > 1 ? trail.map(([url, name], index) => {
        const step = index === trail.length - 1
          ? `<span aria-current="page">${esc(name)}</span>`
          : `<a href="${url}">${esc(name)}</a>`;
        return `<li>${index ? icon('chevron') : ''}${step}</li>`;
      }).join('') : '';
      return `<div class="archive-nav">
        <a class="back-link" href="${parent}"><span class="back-link-icon">${icon('back')}</span>${backLabel}</a>
        ${steps ? `<nav class="archive-trail" aria-label="Arşivdeki konum"><ol>${steps}</ol></nav>` : ''}
      </div>`;
    }

    function arrow() { return `<span class="arrow">${icon('arrow')}</span>`; }

    function courseCard([id, name]) {
      return `
        <a class="course-card" href="${courseUrl(id)}">
          <h2>${esc(name)}</h2>
          <span class="course-card-arrow">${icon('arrow')}</span>
        </a>`;
    }

    function showCourses() {
      const cards = courses.filter(([id]) => !extraCourseIds.has(id)).map(courseCard).join('');
      const extras = `<a class="course-card extras-card" href="${extrasUrl}">
        <div><h2>Ek Dersler</h2><strong class="course-card-meta">HADİS · KELAM · TEFSİR</strong></div>
        <span class="course-card-arrow">${icon('arrow')}</span>
      </a>`;
      main.innerHTML = archiveNav() + `
        <div class="section-line"><h1>Dersler</h1><span class="meta">${courses.length} ders</span></div>
        <section class="course-grid" aria-label="Ders listesi">${cards}${extras}</section>`;
    }

    function showExtraCourses() {
      const cards = courses.filter(([id]) => extraCourseIds.has(id)).map(courseCard).join('');
      main.innerHTML = archiveNav({ extras: true }) + `
        <div class="page-head">
          <h1>Ek Dersler</h1>
        </div>
        <section class="course-grid" aria-label="Ek ders listesi">${cards}</section>`;
    }

    function showCourse(course) {
      const cards = Object.entries(folders).map(([key, folder], index) => `
        <a class="card folder-card" href="${courseUrl(course, key)}">
          <div class="card-top"><span class="card-icon ${index ? 'tone-sand' : ''}">${icon(folder.icon)}</span>${arrow()}</div>
          <div><h3>${folder.title}</h3><p class="meta">${folder.description}</p></div>
          ${fileListState === 'ready' ? `<span class="meta">${forFolder(course, key).length} PDF</span>` : ''}
        </a>`).join('');
      main.innerHTML = archiveNav({ course }) + `
        <div class="page-head">
          <h1>${esc(courseById.get(course))}</h1>
          <p class="meta">PDF’leri görüntülemek için bir bölüm seç.</p>
          <a class="button practice-link" href="../#sorular/${esc(course)}">Haftalık çalışma soruları</a>
        </div>
        <section class="grid folder-grid" aria-label="Dersin dosya bölümleri">${cards}</section>`;
    }

    function showFolder(course, folder) {
      const records = forFolder(course, folder);
      const switches = Object.entries(folders).map(([key, value]) =>
        `<a href="${courseUrl(course, key)}"${key === folder ? ' aria-current="page"' : ''}>${icon(value.icon)}${value.title}</a>`).join('');
      const rows = records.map(record => `
        <div class="file" role="listitem">
          <span class="file-icon">PDF</span>
          <div class="file-name"><strong>${esc(record.name)}</strong>
            <span class="meta">${numberFormat.format(record.size / 1024)} KB</span>
          </div>
          <div class="file-actions">
            <a href="./pdf.html?file=${encodeURIComponent(record.url)}&amp;version=${encodeURIComponent(record.version)}&amp;back=${encodeURIComponent(currentPage())}" aria-label="${esc(record.name)} dosyasını aç">Aç</a>
            <a href="${esc(record.url)}?v=${encodeURIComponent(record.version)}" download="${esc(record.name)}" aria-label="${esc(record.name)} PDF dosyasını indir">PDF indir</a>
            ${record.wordUrl ? `<a href="${esc(record.wordUrl)}" download="${esc(record.wordName)}" aria-label="${esc(record.name)} özgün Word dosyasını indir">Word indir</a>` : ''}
          </div>
        </div>`).join('');
      let fileList;
      if (fileListState === 'loading') {
        fileList = '<div class="files empty" role="status">Dosyalar yükleniyor…</div>';
      } else if (fileListState === 'error') {
        fileList = '<div class="files empty" role="status">Dosya listesi yüklenemedi. Sayfayı yenileyip tekrar dene.</div>';
      } else if (records.length) {
        fileList = `<div class="files" role="list" aria-label="PDF dosyaları">${rows}</div>`;
      } else {
        fileList = '<div class="files empty">Bu bölümde henüz PDF yok.</div>';
      }
      main.innerHTML = archiveNav({ course, folder }) + `
        <div class="page-head"><div class="eyebrow">${esc(courseById.get(course))}</div>
          <h1>${folders[folder].title}</h1>
          <p class="meta">${folders[folder].description}</p>
        </div>
        <nav class="switcher" aria-label="Dosya bölümleri">${switches}</nav>
        <div class="section-line"><h2>Dosyalar</h2>${fileListState === 'ready' ? `<span class="meta">${records.length} PDF</span>` : ''}</div>
        ${fileList}`;
    }

    function render(focus = false) {
      const [, section, item, nestedFolder] = currentPage().split('/');
      const inExtras = section === 'ek-dersler';
      const course = inExtras ? item : section;
      const folder = inExtras ? nestedFolder : item;
      if (inExtras && !extraCourseIds.has(course)) showExtraCourses();
      else if (!courseById.has(course)) showCourses();
      else if (Object.hasOwn(folders, folder)) showFolder(course, folder);
      else showCourse(course);
      if (focus) {
        window.scrollTo(0, 0);
        main.focus({ preventScroll: true });
      }
    }

    async function start() {
      render();
      window.addEventListener('hashchange', () => render(true));
      try {
        const response = await fetch('./files.json');
        if (!response.ok) throw new Error();
        ({ files } = await response.json());
        fileListState = 'ready';
      } catch {
        fileListState = 'error';
        document.getElementById('storage-note').textContent = 'PDF listesi şu anda alınamıyor.';
      }
      render();
    }
    start();
  </script>
</body>
</html>
